namespace: dev

app:
  name: spring

service:
  name: spring-svc
  type: ClusterIP
  port: 8080
  targetPort: 8080

configMap:
  name: spring-config
  data:

    DB_URL: "jdbc:mysql://mysql-svc.dev.svc.cluster.local:3306/dragon_community"
    DB_DRIVER: "com.mysql.cj.jdbc.Driver"

    JWT_ACCESS_TOKEN_EXPIRED_SECONDS: "3600"
    JWT_REFRESH_TOKEN_EXPIRED_SECONDS: "60480"

    CORS_ALLOW_CREDENTIALS: "true"
    CORS_ALLOWED_ORIGIN: "https://sugyo.store"
    CORS_ALLOWED_PATTERN: "/**"
    CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"

    SERVLET_MULTIPART_MAX_FILE_SIZE: "10MB"
    SERVLET_MULTIPART_MAX_REQUEST_SIZE: "10MB"

    SPRING_PROFILES_ACTIVE: "dev"


replicaCount: 1

image:
  repository: megazizon/ktb-community-backend
  tag: 1.0.2
  pullPolicy: Always

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

